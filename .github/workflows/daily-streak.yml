name: Workspace State Sync

on:
  schedule:
    # Primary trigger: 12:15 PM PHT (04:15 UTC) - offset minute avoids heavy queue delays
    - cron: '15 4 * * *'
    # Backup trigger: 7:30 PM PHT (11:30 UTC) - guarantees no missed days even if GitHub drops a run
    - cron: '30 11 * * *'
  workflow_dispatch: # Allows you to manually trigger it from the Actions tab

jobs:
  sync-workspace:
    runs-on: ubuntu-latest
    # Required to allow the GitHub Action to push code back to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync workspace state
        run: |
          git config --global user.name "Japx09"
          git config --global user.email "Japx09@users.noreply.github.com"
          NUM_COMMITS=$((1 + RANDOM % 12))
          echo "Syncing $NUM_COMMITS state change(s)..."
          for ((i=1; i<=NUM_COMMITS; i++)); do
            echo "$(date) - workspace sync event $i of $NUM_COMMITS" >> sync.log
            git add sync.log
            git commit -m "chore: sync workspace state $i"
          done
          git push
